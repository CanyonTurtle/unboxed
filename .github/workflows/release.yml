name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify build.zig.zon version matches the tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          ZON_VERSION=$(grep -oP '(?<=\.version = ")[^"]+' build.zig.zon)
          if [ "$ZON_VERSION" != "$TAG" ]; then
            echo "build.zig.zon version ($ZON_VERSION) does not match tag (v$TAG)"
            exit 1
          fi

      - name: Lint file sizes and comment lengths
        run: zig build lint

      - name: Run unit tests
        run: zig build test

      - name: Build release cart
        run: zig build --release=small

      - name: Bundle standalone web build
        run: |
          mkdir -p dist
          cp zig-out/bin/cart.wasm dist/unboxed.wasm
          npx --yes -p wasm4 w4 bundle zig-out/bin/cart.wasm \
            --html dist/unboxed.html \
            --title "unboxed"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: unboxed ${{ github.ref_name }}
          body: |
            See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for how to play.
          files: |
            dist/unboxed.wasm
            dist/unboxed.html
